name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      # Deliberately requirements-test.txt, not requirements.txt: the
      # current suite is pure Python/regex logic (no model, no DB) and
      # doesn't need torch/transformers/spacy — see that file's own
      # comment for why installing them here would be wasted CI time.
      - run: pip install -r requirements-test.txt

      - run: python -m pytest tests/ -v
