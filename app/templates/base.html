<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lok Sabha Debates Explorer{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        :root {
            color-scheme: light;
            --surface-1: #fcfcfb;
            --page: #f9f9f7;
            --text-primary: #0b0b0b;
            --text-secondary: #52514e;
            --text-muted: #898781;
            --grid: #e1e0d9;
            --border: rgba(11,11,11,0.10);
            --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
            --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
            --diverge-pos: #2a78d6; --diverge-neg: #e34948; --diverge-mid: #f0efec;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --surface-1: #1a1a19; --page: #0d0d0d;
                --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
                --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
                --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
                --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
                --diverge-pos: #3987e5; --diverge-neg: #e66767; --diverge-mid: #383835;
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --surface-1: #1a1a19; --page: #0d0d0d;
            --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
            --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
            --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
            --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
            --diverge-pos: #3987e5; --diverge-neg: #e66767; --diverge-mid: #383835;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--page); color: var(--text-primary);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        header {
            display: flex; align-items: center; gap: 1.5rem;
            padding: 0.9rem 1.5rem; background: var(--surface-1); border-bottom: 1px solid var(--border);
        }
        header a { color: var(--text-primary); text-decoration: none; font-weight: 600; }
        header a.brand { font-weight: 700; }
        header nav { display: flex; gap: 1rem; }
        header nav a { color: var(--text-secondary); font-weight: 500; }
        header nav a:hover { color: var(--text-primary); }
        main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
        .card {
            background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
            padding: 1.25rem; margin-bottom: 1.25rem;
        }
        h1, h2, h3 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--grid); }
        th { color: var(--text-secondary); font-weight: 600; }
        .muted { color: var(--text-muted); }
        input, select, button {
            font: inherit; padding: 0.5rem 0.7rem; border-radius: 6px; border: 1px solid var(--border);
            background: var(--surface-1); color: var(--text-primary);
        }
        button { cursor: pointer; font-weight: 600; }
        .filters { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 1rem; }
        .speech { padding: 0.75rem 0; border-bottom: 1px solid var(--grid); }
        .speech:last-child { border-bottom: none; }
        .speech-meta { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.25rem; }
        details summary { cursor: pointer; color: var(--text-secondary); font-size: 0.85rem; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <a class="brand" href="/">Lok Sabha Debates Explorer</a>
        <nav>
            <a href="/explore">Explore</a>
            <a href="/insights">Insights</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
